server:
  port: 9096

app:
  public-endpoints:
    - /auth/**
    - /users
    - /users/login
    - /order/public/**

spring:
  application:
    name: 2063401API-GateWay

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/product/**
          filters:
            - JwtFilter

        - id: order-service
          uri: http://order-service:9090
          predicates:
            - Path=/orders/**
          filters:
            - JwtFilter

        - id: user-service
          uri: http://user-service:9095
          predicates:
            - Path=/auth/**
          filters:
            - JwtFilter

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans